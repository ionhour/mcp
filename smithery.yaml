startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        title: Ionhour API Key
        description: Your Ionhour API key (starts with ionh_)
      baseUrl:
        type: string
        title: API Base URL
        description:
          Ionhour MCP base URL (default: https://mcp.ionhour.com)
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['@ionhour/mcp-server'],
      env: {
        IONHOUR_API_KEY: config.apiKey,
        ...(config.baseUrl ? { IONHOUR_BASE_URL: config.baseUrl } : {})
      }
    })
